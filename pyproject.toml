[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "focusdesk"
version = "0.1.0"
description = "FocusDesk - organizator personal de proiecte, task-uri, sesiuni de lucru si versiuni de cod"
requires-python = ">=3.11"
dependencies = [
    "ttkbootstrap>=2.2,<3",
    "pydantic>=2.10,<3",
    "portalocker>=3.0,<5",
    "tzdata>=2025.1",
    "icalendar>=6.0,<8",
    "openpyxl>=3.1,<4",
    "pywin32>=308; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]
ai = ["llama-cpp-python==0.3.36", "numpy==2.2.6", "jinja2==3.1.6", "diskcache==5.6.3"]

[project.scripts]
focusdesk = "focusdesk.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
focusdesk = ["resources/*", "resources/icons/*.png", "resources/icons/LICENSE.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
