name: FocusDesk Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusdesk-windows-distribution
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      FD_UI_WATCHDOG: '600'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install exact, verified Windows wheels
        shell: pwsh
        run: |
          python -m pip download --only-binary=:all: -r packaging/requirements-windows.lock --dest "$env:RUNNER_TEMP/wheelhouse"
          if ($LASTEXITCODE -ne 0) { throw 'Wheel download failed' }
          python scripts/verify_windows_wheels.py "$env:RUNNER_TEMP/wheelhouse"
          if ($LASTEXITCODE -ne 0) { throw 'Wheel verification failed' }
          python -m pip install --no-index --no-deps --find-links "$env:RUNNER_TEMP/wheelhouse" -r packaging/requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          python -m pip install --no-deps --no-build-isolation -e .
          if ($LASTEXITCODE -ne 0) { throw 'Project install failed' }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw 'Dependency check failed' }
          Remove-Item "$env:RUNNER_TEMP/wheelhouse" -Recurse -Force
      - name: Test application (fake backends, no Outlook requirement)
        shell: pwsh
        run: |
          python -m pytest -q --junitxml="$env:RUNNER_TEMP/tests.xml"
          if ($LASTEXITCODE -ne 0) {
            Write-Output '::error::Windows tests failed; inspect the JUnit verification artifact.'
            throw 'Tests failed'
          }
          python -c "import xml.etree.ElementTree as E; r=E.parse(r'$env:RUNNER_TEMP/tests.xml').getroot(); print('::notice title=Windows tests::' + str([s.attrib for s in r.iter('testsuite')]))"
      - name: Build onedir with resources and licenses
        shell: pwsh
        run: |
          ./scripts/build.ps1 -Python (Get-Command python).Source -OutDir "$env:RUNNER_TEMP/focusdesk-build" -SkipTests -SkipSmoke
      - name: Verify packaged application with empty PATH
        shell: pwsh
        run: |
          python scripts/verify_distribution.py --exe "$env:RUNNER_TEMP/focusdesk-build/dist/FocusDesk/FocusDesk.exe" --reports "$env:RUNNER_TEMP/focusdesk-reports"
          if ($LASTEXITCODE -ne 0) { throw 'Packaged application verification failed' }
      - name: Audit and package application
        shell: pwsh
        run: |
          python scripts/package_windows.py --bundle "$env:RUNNER_TEMP/focusdesk-build/dist/FocusDesk" --output "$env:RUNNER_TEMP/packages"
          if ($LASTEXITCODE -ne 0) { throw 'Distribution audit failed' }
          'Extract both the artifact container and the enclosed ZIP; keep the whole FocusDesk folder. Outlook Classic verification remains manual.' >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FocusDesk-Windows-x64
          path: |
            ${{ runner.temp }}/packages/FocusDesk-Windows-x64.zip
            ${{ runner.temp }}/packages/FocusDesk-Windows-x64.zip.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: FocusDesk-Windows-x64-verificari
          path: |
            ${{ runner.temp }}/tests.xml
            ${{ runner.temp }}/focusdesk-reports/*.json
          retention-days: 7
          if-no-files-found: warn
